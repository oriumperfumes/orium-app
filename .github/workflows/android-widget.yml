# Gera o app "Orium Widgets" (Android) sempre que a pasta apps/android-widget
# muda. O APK fica em Releases → "android-widgets" (orium-widgets.apk).
name: Android widgets

on:
  push:
    branches: [main]
    paths: ["apps/android-widget/**", ".github/workflows/android-widget.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build APK
        working-directory: apps/android-widget
        run: gradle assembleDebug --no-daemon
      - name: Rename
        run: cp apps/android-widget/app/build/outputs/apk/debug/app-debug.apk orium-widgets.apk
      - uses: actions/upload-artifact@v4
        with:
          name: orium-widgets
          path: orium-widgets.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-widgets
          name: Orium Widgets (Android)
          body: "App dos widgets de pedidos. Baixe o orium-widgets.apk no celular Android e instale."
          files: orium-widgets.apk
          make_latest: true
